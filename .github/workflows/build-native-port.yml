name: Build the linked Universe Windows port
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/linked-port-*']
    paths:
      - 'native/universe/**'
      - 'tools/native/prepare_universe_port.py'
      - '.github/workflows/build-native-port.yml'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows-port:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated downstream sources
        run: python tools/native/prepare_universe_port.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make p7zip git python flex bison ninja mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-enet
            mingw-w64-ucrt-x86_64-arm-none-eabi-gcc zip
            mingw-w64-ucrt-x86_64-libpng mingw-w64-ucrt-x86_64-pkgconf
      - name: Identify the installed toolchain
        id: toolchain
        shell: msys2 {0}
        run: |
          fingerprint=$(pacman -Q | sha256sum | cut -d' ' -f1)
          echo "sha=$fingerprint" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          gcc --version
          python3 --version
      - uses: actions/cache@v4
        with:
          path: |
            native-runtime/universe-port/build_win64
            native-runtime/universe-port/subprojects
            native-runtime/universe-port/tools/metroskrew
          key: ${{ runner.os }}-universe-port-${{ steps.toolchain.outputs.sha }}-${{ hashFiles('native/universe/port-lock.json', '.github/workflows/build-native-port.yml') }}
      - name: Compile the complete Windows PC port with Universe
        shell: msys2 {0}
        run: |
          set -o pipefail
          cd native-runtime/universe-port
          make build_win64/build.ninja 2>&1 | tee ../universe-port-build.log
          subprojects/meson-1.12.0/meson.py compile -C build_win64 main 2>&1 | tee -a ../universe-port-build.log
          mkdir -p build_win64/universe-engine
          cp build_win64/main.exe build_win64/universe-engine/main.exe
          cp res/pc_port/header.bin build_win64/universe-engine/header.bin
          cp res/pc_port/dwc_nv.bin build_win64/universe-engine/firmware.bin
          for library in SDL2.dll libwinpthread-1.dll libenet-7.dll libgcc_s_seh-1.dll libstdc++-6.dll; do
            cp "/ucrt64/bin/$library" "build_win64/universe-engine/$library"
          done
      - name: Run diagnostics from the actual linked game executable
        timeout-minutes: 2
        shell: msys2 {0}
        run: |
          set -o pipefail
          cd native-runtime/universe-port/build_win64/universe-engine
          ./main.exe --universe-self-test | tee ../../../universe-port-selftest.json
      - name: Assemble a verified French candidate without a ROM
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/native/start_windows.ps1 -PrepareOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = Get-Content distribution/windows/release.json -Raw | ConvertFrom-Json
          python tools/native/stage_linked_runtime.py --base-runtime "native-runtime/windows-builds/$($release.build_id)" --built-engine native-runtime/universe-port/build_win64/universe-engine --build-manifest native-runtime/universe-port/universe-port-build.json --output native-runtime/universe-linked-fr
          exit $LASTEXITCODE
      - name: Verify the portable candidate without the compiler DLL path
        timeout-minutes: 2
        shell: powershell
        run: |
          $candidate = (Resolve-Path native-runtime/universe-linked-fr).Path
          $originalPath = $env:PATH
          try {
            Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class ErrorMode { [DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode); }'
            [ErrorMode]::SetErrorMode(0x8003) | Out-Null
            $env:PATH = "$candidate;$env:SystemRoot\System32;$env:SystemRoot"
            Push-Location $candidate
            & .\main.exe --universe-self-test
            $code = $LASTEXITCODE
            Pop-Location
            exit $code
          } finally { $env:PATH = $originalPath }
      - name: Keep build logs and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-native-build-diagnostics
          path: |
            native-runtime/universe-port-build.log
            native-runtime/universe-port-selftest.json
            native-runtime/universe-linked-fr/universe-port-build.json
            native-runtime/universe-port/universe-port-build.json
            native-runtime/universe-port/build_win64/meson-logs/meson-log.txt
      - name: Keep the development executable
        uses: actions/upload-artifact@v4
        with:
          name: universe-linked-windows-development
          path: native-runtime/universe-linked-fr/
